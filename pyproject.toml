[project]
name = "graph-algorithms-explorer-worklet1"
version = "1.0.0"
description = "COEP Mini Project 9 - Worklet 1: graph model, traversal and connectivity"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["worklet1/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "C4", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = false
